name: Upload verified 0.1.1 draft assets
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release-0.1.1-assets
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify source CI, download exact artifact and upload draft files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          repo = 'Xero-05/xenon-browser'
          source = 'e7e6d071552f7a8e192318ffbee228ec99b6ea24'
          run_id = 37383127246
          release_id = 404144533
          expected = {
              'Xenon-0.1.1-windows-x64-unsigned.zip': (234098088, '14597370a5b6ff701482ec7f79f888e31f1c08f124b6e35e61ffb38a89ac0021'),
              'Xenon-0.1.1-windows-x64-unsigned.zip.sha256': (103, 'e7043569593595408bfef113e3b2c52af8ee0fb6fc69bc77bba73e212db6702b'),
              'Xenon-0.1.1-windows-x64-setup-unsigned.exe': (203486544, '4da48aff5f33515d336dd87df614253587cfccedad0cf51ac33c6ccaf78b7fa3'),
              'Xenon-0.1.1-windows-x64-setup-unsigned.exe.sha256': (109, '6aad4480b52d5e181e2969dc3fbcf2d542551754c7e4ed7041569a26f33ccd59'),
          }
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + endpoint], text=True))
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          def release():
              data = api('/releases/' + str(release_id))
              require(data['tag_name'] == 'v0.1.1' and data['target_commitish'] == source and data['draft'] and not data['prerelease'], 'Draft identity changed')
              return data
          def checked_assets(data):
              found = {}
              for asset in data['assets']:
                  name = asset['name']
                  require(name in expected and name not in found, 'Unexpected or duplicate remote asset')
                  size, digest = expected[name]
                  require(asset['size'] == size and asset['digest'] == 'sha256:' + digest and asset['state'] == 'uploaded', 'Remote asset differs: ' + name)
                  found[name] = asset
              return found
          ci = api('/actions/runs/' + str(run_id))
          require(ci['head_sha'] == source and ci['event'] == 'push' and ci['status'] == 'completed' and ci['conclusion'] == 'success', 'Release source CI did not pass')
          artifacts = api('/actions/runs/' + str(run_id) + '/artifacts')['artifacts']
          artifacts = [item for item in artifacts if item['id'] == 11375478946 and item['name'] == 'xenon-windows-x64-unsigned']
          require(len(artifacts) == 1 and not artifacts[0]['expired'] and artifacts[0]['digest'] == 'sha256:342f1a89751b6c1a07cd7aa1852039bdc2012f22f9eada018d23eae36c9def42', 'CI artifact identity changed')
          checked_assets(release())
          subprocess.run(['gh', 'run', 'download', str(run_id), '--repo', repo, '--name', 'xenon-windows-x64-unsigned', '--dir', 'payload'], check=True)
          for name, (size, digest) in expected.items():
              path = pathlib.Path('payload/dist') / name
              require(path.is_file() and path.stat().st_size == size, 'Local asset size differs: ' + name)
              with path.open('rb') as file:
                  actual = hashlib.file_digest(file, 'sha256').hexdigest()
              require(actual == digest, 'Local asset digest differs: ' + name)
          for name in expected:
              if name not in checked_assets(release()):
                  subprocess.run(['gh', 'release', 'upload', 'v0.1.1', str(pathlib.Path('payload/dist') / name), '--repo', repo], check=True)
          require(set(checked_assets(release())) == set(expected), 'Draft does not contain all four exact assets')
          print('Verified all four CI-built files on draft v0.1.1; release remains unpublished.')
          PY
