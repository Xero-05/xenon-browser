name: Windows alpha
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch pinned native dependencies
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Use bundled Node runtime
        shell: pwsh
        run: |
          $nodeDistribution = Join-Path $PWD 'third_party/downloads/node-extracted/node-v24.16.0-win-x64'
          $nodeDistribution | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Build and run native and SDK tests
        shell: pwsh
        run: ./scripts/build.ps1 -Test
      - name: Package unsigned Windows alpha
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify release manifest and archive
        shell: pwsh
        run: ./scripts/verify-package.ps1 -Zip ./dist/Xenon-0.1.0-alpha.9-windows-x64-unsigned.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xenon-windows-x64-unsigned
          path: |
            dist/*.zip
            dist/*.sha256
            out/*results.json
            out/*tests.xml
          if-no-files-found: error
