name: Windows release
on:
  push:
    # Release commits on main are built; PR branches build once through pull_request, and tags do not duplicate them.
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Test dependency download and extraction recovery
        shell: pwsh
        timeout-minutes: 3
        run: node --test tests/bootstrap-download-tests.mjs tests/bootstrap-extract-tests.mjs
      - name: Restore pinned dependency downloads
        id: native-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        timeout-minutes: 3
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          # No extracted directories, partial transfers or prefix-key fallback.
          path: |
            third_party/downloads/*.tar.bz2
            third_party/downloads/*.zip
            third_party/downloads/*.hpp
          key: native-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.lock.json') }}
      - name: Download and verify pinned native dependencies
        shell: pwsh
        timeout-minutes: 20
        run: ./scripts/bootstrap.ps1 -DownloadOnly
      - name: Save verified dependency downloads
        if: steps.native-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        timeout-minutes: 3
        continue-on-error: true
        with:
          # Bootstrap verifies the pinned hashes even when downloads are cached.
          path: |
            third_party/downloads/*.tar.bz2
            third_party/downloads/*.zip
            third_party/downloads/*.hpp
          key: native-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.lock.json') }}
      - name: Extract verified native dependencies
        shell: pwsh
        timeout-minutes: 8
        run: ./scripts/bootstrap.ps1
      - name: Use bundled Node runtime
        shell: pwsh
        run: |
          $nodeVersion = (Get-Content -LiteralPath ./dependencies.lock.json -Raw | ConvertFrom-Json).node.version
          $nodeDistribution = Join-Path $PWD "third_party/downloads/node-extracted/node-v$nodeVersion-win-x64"
          # Fail here instead of letting npm fall back to the runner's preinstalled Node.
          if (-not (Test-Path -LiteralPath (Join-Path $nodeDistribution 'node.exe') -PathType Leaf)) {
            throw "Bundled Node $nodeVersion was not extracted to $nodeDistribution."
          }
          $nodeDistribution | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Build and run native and SDK tests
        shell: pwsh
        run: ./scripts/build.ps1 -Test
      - name: Package unsigned Windows release
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify release manifest and archive
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          ./scripts/verify-package.ps1 -Zip "./dist/Xenon-$version-windows-x64-unsigned.zip"
      - name: Bootstrap pinned installer compiler
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/bootstrap-installer.ps1
      - name: Test isolated installer lifecycle
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installer-tests.ps1
      - name: Build unsigned Windows installer
        shell: pwsh
        timeout-minutes: 10
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          ./scripts/build-installer.ps1 -Zip "./dist/Xenon-$version-windows-x64-unsigned.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xenon-windows-x64-unsigned
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*-setup-unsigned.exe
            out/*results.json
            out/*tests.xml
          if-no-files-found: error
      - name: Smoke test the extracted release archive
        id: package-smoke
        shell: pwsh
        timeout-minutes: 8
        run: |
          # Extract the archive bytes rather than reusing the staging directory they were zipped from.
          $version = (Get-Content ./VERSION -Raw).Trim()
          $name = "Xenon-$version-windows-x64-unsigned"
          $extract = Join-Path $env:RUNNER_TEMP 'xenon-release'
          Expand-Archive -LiteralPath "./dist/$name.zip" -DestinationPath $extract
          node tests/package-smoke.mjs (Join-Path $extract $name)
          if ($LASTEXITCODE -ne 0) { throw 'Extracted release smoke test failed.' }
      - name: Run live browser suites on the packaged build
        shell: pwsh
        timeout-minutes: 20
        run: |
          # The suites launch build/app/Release, so require the DLL that was packaged.
          $version = (Get-Content ./VERSION -Raw).Trim()
          $manifestPath = Join-Path $env:RUNNER_TEMP "xenon-release/Xenon-$version-windows-x64-unsigned/release-manifest.json"
          $packaged = ((Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json).files | Where-Object path -eq 'Xenon.dll').sha256
          $built = (Get-FileHash -LiteralPath ./build/app/Release/Xenon.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $packaged -or $built -ne $packaged) { throw 'build/app/Release/Xenon.dll is not the packaged DLL.' }
          # Serial, never concurrent; each suite uses its own generated profile and private pipe.
          $failed = @()
          foreach ($suite in 'integration', 'batch-integration', 'visibility-integration', 'worker-lifecycle-integration',
                             'upload-entry-integration', 'persistence-integration', 'theme-integration') {
            Write-Host "::group::$suite"
            node "tests/$suite.mjs"
            if ($LASTEXITCODE -ne 0) { $failed += $suite }
            Write-Host '::endgroup::'
          }
          if ($failed) { throw "Live browser suites failed: $($failed -join ', ')" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.package-smoke.outcome != 'skipped'
        with:
          name: xenon-live-results
          path: out/*.json
          if-no-files-found: warn
  adapter-linux:
    # Fast adapter feedback only; build-test remains the release build.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Read pinned Node version
        id: node-lock
        run: |
          version="$(jq -er '.node.version' dependencies.lock.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: ${{ steps.node-lock.outputs.version }}
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Typecheck adapter
        run: npm run typecheck
      - name: Run adapter and SDK tests
        run: npm test
